<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>💖 Menny ♥ Chandu 💖</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;

background:
linear-gradient(
rgba(0,0,0,0.45),
rgba(0,0,0,0.45)
),
url('couple.jpeg');

background-size:cover;
background-position:center;
background-repeat:no-repeat;
}

.login-box{
width:360px;
padding:35px;

background:rgba(255,255,255,0.12);
backdrop-filter:blur(15px);

border-radius:25px;

box-shadow:
0 0 40px rgba(255,255,255,0.2);

text-align:center;
}

h1{
color:white;
font-size:32px;
margin-bottom:10px;
text-shadow:0 0 15px #ff69b4;
}

.subtitle{
color:white;
margin-bottom:25px;
font-size:15px;
}

input{
width:100%;
padding:14px;
margin:10px 0;

border:none;
outline:none;

border-radius:12px;

font-size:15px;
}

button{
width:100%;
padding:14px;

margin-top:15px;

border:none;
border-radius:12px;

background:#ff4d94;

color:white;
font-size:16px;

cursor:pointer;

transition:0.3s;
}

button:hover{
transform:scale(1.03);
background:#ff1f75;
}

#error{
margin-top:15px;
color:#ffd6e7;
font-size:14px;
}

.hearts{
position:absolute;
width:100%;
height:100%;
overflow:hidden;
pointer-events:none;
}

.hearts span{
position:absolute;
bottom:-50px;
font-size:22px;
animation:float 8s linear infinite;
}

.hearts span:nth-child(1){left:10%;animation-delay:0s;}
.hearts span:nth-child(2){left:25%;animation-delay:2s;}
.hearts span:nth-child(3){left:40%;animation-delay:4s;}
.hearts span:nth-child(4){left:60%;animation-delay:1s;}
.hearts span:nth-child(5){left:80%;animation-delay:3s;}

@keyframes float{
0%{
transform:translateY(0);
opacity:0;
}
20%{
opacity:1;
}
100%{
transform:translateY(-110vh);
opacity:0;
}
}

</style>
</head>

<body>

<div class="hearts">
<span>❤️</span>
<span>💖</span>
<span>💕</span>
<span>💗</span>
<span>❤️</span>
</div>

<div class="login-box">

<h1>💖 Menny ♥ Chandu 💖</h1>

<p class="subtitle">
Forever Together ✨
</p>

<input
type="text"
id="username"
placeholder="Username">

<input
type="password"
id="password"
placeholder="Password">

<button onclick="login()">
Enter Gallery ❤️
</button>

<div id="error"></div>

</div>

<script>

function login(){

const user =
document.getElementById("username").value;

const pass =
document.getElementById("password").value;

if(
user === "Menny@chandu" &&
pass === "2003"
){
window.location.href = "camera.html";
}
else{
document.getElementById("error").innerHTML =
"❌ Wrong Username or Password";
}

}

</script>

</body>
</html>
